name: Compare Android 17 startup
on:
  push:
    branches: [fix/android17-startup]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['36', '37.0']
    steps:
      - uses: actions/checkout@v4
      - name: Get the published and corrected APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 --pattern 'AfterLastTrain-0.1.0.apk' --output Escape-original.apk
          gh run watch 45743167702 --exit-status --interval 10
          gh run download 45743167702 --name 'AfterLastTrain-0.1.1' --dir .
          mv AfterLastTrain-0.1.1.apk Escape-corrected.apk
      - name: Enable emulator virtualization
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          else
            echo "Using emulated CPU"
          fi
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          system-image-api-level: '${{ matrix.image }}'
          channel: canary
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/compare-startup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-${{ matrix.image }}-comparison
          path: |
            Escape-*.txt
            Escape-*.xml
