name: Android APK
on:
  push:
    branches: [main, escape-android, fix/startup-window]
    paths: ['app/**', 'settings.gradle', 'tools/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate story graph and build a signed debug APK
        run: |
          python3 tools/validate_story.py
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk AfterLastTrain-0.3.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose AfterLastTrain-0.3.0.apk
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          system-image-api-level: '37.0'
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: python3 tools/check_startup.py
      - uses: actions/upload-artifact@v4
        with:
          name: AfterLastTrain-0.3.0
          path: |
            AfterLastTrain-0.3.0.apk
            Escape-*.png
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AfterLastTrain-0.3.0
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view v0.3.0 --repo "$REPO" >/dev/null 2>&1; then
            gh release upload v0.3.0 AfterLastTrain-0.3.0.apk Escape-*.png --repo "$REPO" --clobber
          else
            gh release create v0.3.0 AfterLastTrain-0.3.0.apk Escape-*.png --repo "$REPO" --target "$SHA" --title '막차가 떠난 뒤 0.3.0' --notes '열차와 셔터, 인물 동작 및 분기 선택 개편.'
          fi
