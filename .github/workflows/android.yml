name: Android APK
on:
  push:
    branches: [main, escape-android]
    paths: ['app/**', 'settings.gradle', 'tools/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate story graph and build a signed debug APK
        run: |
          python3 tools/validate_story.py
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          cp app/build/outputs/apk/debug/app-debug.apk AfterLastTrain-0.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose AfterLastTrain-0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AfterLastTrain-0.1.0
          path: AfterLastTrain-0.1.0.apk
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AfterLastTrain-0.1.0
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view v0.1.0 --repo "$REPO" >/dev/null 2>&1; then
            gh release upload v0.1.0 AfterLastTrain-0.1.0.apk --repo "$REPO" --clobber
          else
            gh release create v0.1.0 AfterLastTrain-0.1.0.apk --repo "$REPO" --target "$SHA" --title '막차가 떠난 뒤 0.1.0' --notes 'Android 설치 APK'
          fi
